workflows:
  featherfreeway-appstore:
    name: Feather Freeway App Store
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      groups:
        - featherfreeway_appstore
      vars:
        BUNDLE_ID: com.featherfreeway.game27
        XCODE_PROJECT: FeatherFreeway.xcodeproj
        XCODE_SCHEME: FeatherFreeway
      xcode: latest
    scripts:
      - name: Initialize signing keychain
        script: keychain initialize
      - name: Fetch App Store signing files
        script: app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Install signing certificates
        script: keychain add-certificates
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Set unique build number
        script: agvtool new-version -all "$((1213 + BUILD_NUMBER))"
      - name: Build signed IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
        submit_to_app_store: false
